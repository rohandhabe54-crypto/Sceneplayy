name: Lifestyle Reel Uploader

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  upload-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests gdown

      - name: Run Script
        env:
          ACCESS_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          python ./lifestyle_Github.py
